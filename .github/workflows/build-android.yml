name: Build Android Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pir_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Test Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd pir_app
          flutter pub get

      - name: Run Test Suite
        run: |
          cd pir_app
          flutter test

      - name: Build Android APK (Release)
        run: |
          cd pir_app
          flutter build apk --release

      - name: Compute SHA-256 Checksum
        run: |
          cd pir_app/build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          echo "SHA-256 Checksum:"
          cat app-release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIR_App_v1.2.0_Android_APK
          path: |
            pir_app/build/app/outputs/flutter-apk/app-release.apk
            pir_app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
