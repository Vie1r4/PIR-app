name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - feat/ios-dev
  schedule:
    # Sincroniza automaticamente 3 vezes por dia (07:00, 12:00, 17:00 UTC)
    - cron: '0 7,12,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd pir_app
          flutter pub get

      - name: Sync IPMA 9-Day Data
        run: |
          cd pir_app
          dart tool/sync_ipma.dart

      - name: Build Web
        run: |
          cd pir_app
          flutter build web --release --base-href "/PIR-app/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pir_app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
