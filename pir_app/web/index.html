<!DOCTYPE html>
<html>
<head>

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PIR - Consulta rápida do perigo e risco de incêndio rural em Portugal Continental com dados oficiais do IPMA.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PIR Incêndio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#0D0E11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">

  <title>PIR – Perigo de Incêndio Rural</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0D0E11;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body style="background-color: #0D0E11;">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].update();
          }
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
