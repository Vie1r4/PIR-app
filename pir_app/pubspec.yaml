name: pir_app
description: PIR - Perigo de Incêndio Rural. Consulta rápida do risco de incêndio rural do IPMA.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  hive_flutter: ^1.1.0
  provider: ^6.1.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logopirapp.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logopirapp.png"

flutter_native_splash:
  color: "#F4F5F8"
  color_dark: "#0D0E11"
  image: "assets/logopirapp.png"
  ios: true
  android: true
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/concelhos.json
    - assets/logopirapp.png
    - assets/concelhos_geo.json
